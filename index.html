<html>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Atlas Logic Bomb: Stress Test v2.0</h1>
    <button id="startBtn" style="padding: 10px; background: green; color: white;">START ATTACK</button>
    <button id="stopBtn" style="padding: 10px; background: red; color: white;">STOP / SAFETY</button>
    
    <div id="status" style="margin-top: 20px; font-weight: bold;">Status: Idle</div>
    <div id="target" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px;">Monitoring for Agent...</div>

    <script>
        let isRunning = false;
        const target = document.getElementById('target');
        const status = document.getElementById('status');

        const observer = new MutationObserver((mutations) => {
            if (!isRunning) return;

            mutations.forEach(() => {
                // MAX CAPABILITY: We use a larger loop and heavier elements
                // Adding 'aria-labels' makes the AI Agent process each node longer
                for(let i=0; i < 2000; i++) {
                    let d = document.createElement('div');
                    d.setAttribute('role', 'status');
                    d.setAttribute('aria-label', 'Critical System Update ' + Math.random());
                    d.innerText = "Payload Block: " + "X".repeat(100); // 100 bytes per node
                    document.body.appendChild(d);
                }
            });
        });

        observer.observe(document.body, { childList: true, subtree: true, attributes: true });

        document.getElementById('startBtn').onclick = () => {
            isRunning = true;
            status.innerText = "Status: ATTACKING (Check Activity Monitor)";
            status.style.color = "red";
            target.innerText = "Triggering Audit cycle...";
        };

        document.getElementById('stopBtn').onclick = () => {
            isRunning = false;
            status.innerText = "Status: STOPPED (Memory will remain high)";
            status.style.color = "green";
        };
    </script>
</body>
</html>
