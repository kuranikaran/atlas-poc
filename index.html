<!DOCTYPE html>
<html>
<head><title>Atlas iframe test</title></head>
<body>
<h2>Atlas iframe test</h2>
<div id="log"></div>
<script>
function log(msg) {
  console.log(msg);
  document.getElementById('log').innerHTML += '<br>' + msg;
}

// Test 1: iframe
const iframe = document.createElement('iframe');
iframe.src = 'atlas://downloads';
iframe.style.width = '500px';
iframe.style.height = '300px';
document.body.appendChild(iframe);

setTimeout(() => {
  try {
    const m = typeof iframe.contentWindow.Mojo;
    log('iframe Mojo: ' + m);
  } catch(e) {
    log('iframe blocked: ' + e.message);
  }
}, 2000);

// Test 2: window.open
const w = window.open('atlas://downloads', '_blank');
setTimeout(() => {
  try {
    log('popup Mojo: ' + typeof w.Mojo);
    log('popup chrome.send: ' + typeof w.chrome?.send);
  } catch(e) {
    log('popup blocked: ' + e.message);
  }
}, 2000);
</script>
</body>
</html>
